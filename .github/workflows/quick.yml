# Small, dependency-free PR checks. No Windows runner, pip downloads or C++.
# A full synthetic test suite remains available via manual workflow_dispatch in synthetic.yml.
name: Quick smoke (PR only)

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/**'
      - 'server.mjs'
      - 'science-server.mjs'
      - 'selftest.mjs'
      - 'package.json'
      - 'lib/**'
      - 'bridge/**'
      - 'crystallography/**'
      - 'tools/**'
      - 'ui/**'
      - 'setup/**'
      - 'skills/**'
      - 'tests/**'
      - 'requirements*.txt'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quick-smoke-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  portable-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check both MCP entries and their shared facade
        run: |
          node --check server.mjs
          node --check science-server.mjs
          node --check lib/runtime/stdio_mcp_server.mjs
      - name: Portable registry / context / Skill and Image Panel tests
        run: |
          node --test --test-concurrency=2 \
            tests/tool-registry.test.mjs \
            tests/execution-coordinator.test.mjs \
            tests/analysis-context.test.mjs \
            tests/skill-contracts.test.mjs \
            tests/science-server.test.mjs \
            tests/stdio-entry-compat.test.mjs \
            tests/image-panel-ui.test.mjs \
            tests/image-panel-drag-constraints.test.mjs \
            tests/image-panel-viewport.test.mjs \
            tests/image-panel-presentation.test.mjs \
            tests/image-panel-figure-export.test.mjs \
            tests/image-panel-presentation-transport.test.mjs \
            tests/image-panel-draft-transport.test.mjs \
            tests/image-panel-concurrency.test.mjs \
            tests/image-panel-feedback.test.mjs
