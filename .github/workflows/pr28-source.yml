name: PR28 isolated source snapshot
on:
  push:
    branches: [validation/pr28-closeout-20261027]
    paths: [.github/workflows/pr28-source.yml]
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 2e189236144ef94260175ffd6b0293ae75171521
          persist-credentials: false
      - name: Archive exact public source without credentials
        run: |
          test "$(git rev-parse HEAD)" = "2e189236144ef94260175ffd6b0293ae75171521"
          mkdir -p "$RUNNER_TEMP/pr28-source"
          git archive --format=zip HEAD > "$RUNNER_TEMP/pr28-source/pr26-source.zip"
          git ls-tree -r HEAD > "$RUNNER_TEMP/pr28-source/tree.txt"
          git rev-parse HEAD HEAD^{tree} > "$RUNNER_TEMP/pr28-source/identity.txt"
      - uses: actions/upload-artifact@v4
        with:
          name: pr28-review-source
          path: ${{ runner.temp }}/pr28-source
          retention-days: 7
