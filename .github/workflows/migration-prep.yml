# Source-scoped migration smoke; no pip install, GMS host, C++ build or full suite.
name: Migration preparation (scoped)
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/migration-prep.yml'
      - 'migration/**'
      - 'tools/prepare_repository_split.py'
      - 'tests/test_repository_split.py'
      - 'tests/repository-split-catalog.test.mjs'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: migration-preparation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  preparation:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Migration safety tests
        run: |
          python -B -m unittest discover -s tests -p test_repository_split.py -v
      - name: Compose pinned unmerged inputs only in a disposable worktree
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin e6f1301a29cb0d4e6d5e6a4b5856e2cdf6b3169a a158b1ac58af7d3b6e68d9e95afb17becaedfe2c
          git worktree add --detach "$RUNNER_TEMP/split-source" HEAD
          for sha in e6f1301a29cb0d4e6d5e6a4b5856e2cdf6b3169a a158b1ac58af7d3b6e68d9e95afb17becaedfe2c; do
            git -C "$RUNNER_TEMP/split-source" -c user.name='Migration smoke' -c user.email='migration@localhost' merge --no-ff --no-edit "$sha"
          done
          python -B tools/prepare_repository_split.py --source-ref "$(git -C "$RUNNER_TEMP/split-source" rev-parse HEAD)" --recipe-ref "$(git rev-parse HEAD)" --output "$RUNNER_TEMP/split-candidates"
      - name: Independent exported providers and exact original catalog parity
        shell: bash
        run: |
          set -euo pipefail
          (cd "$RUNNER_TEMP/split-candidates/microscopy-core" && npm test)
          (cd "$RUNNER_TEMP/split-candidates/mcp-dm" && npm test)
          SPLIT_SOURCE_ROOT="$RUNNER_TEMP/split-source" SPLIT_OUTPUT_ROOT="$RUNNER_TEMP/split-candidates" node --test tests/repository-split-catalog.test.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: independent-provider-candidates
          path: ${{ runner.temp }}/split-candidates
          # Only the audited export is uploaded; .gitignore/.github are required.
          include-hidden-files: true
          retention-days: 7
          if-no-files-found: error
