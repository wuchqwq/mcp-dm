name: Validate reviewed native core for partial merge
on:
  push:
    branches: [merge/validate-native-core-20261023]
permissions:
  contents: write
jobs:
  validate:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Preserve isolated patch script and check out reviewed baseline
        shell: pwsh
        run: |
          Copy-Item .github/prepare_native_core.py "$env:RUNNER_TEMP/prepare_native_core.py"
          git checkout --detach 3c9715c388e0a109d468de2dbeee2c8b0d8d5d67
          if ($LASTEXITCODE -ne 0) { throw 'baseline checkout failed' }
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Prepare narrow candidate
        run: python "$env:RUNNER_TEMP/prepare_native_core.py"
      - name: Install isolated test dependencies
        run: python -m pip install -r requirements-dev.txt -r requirements-analysis.txt
      - name: Python synthetic regression
        run: python -B -m unittest discover -s tests -p 'test_*.py' -v
      - name: Node protocol and facade regression
        run: node --test
      - name: Mock MCP chain
        run: node selftest.mjs
        env:
          DM_TEST_PYTHON: python
      - name: Compile and test synthetic native core
        shell: pwsh
        run: |
          $gxx = Get-Command g++.exe -ErrorAction SilentlyContinue
          if (-not $gxx -and (Test-Path 'C:\mingw64\bin\g++.exe')) { $cxx = 'C:\mingw64\bin\g++.exe' }
          elseif ($gxx) { $cxx = $gxx.Source }
          else { throw 'No installed MinGW compiler; no DM or toolchain installation attempted' }
          & .\experiments\native-bridge\mvp\build.ps1 -Cxx $cxx -OfflineOnly
          if ($LASTEXITCODE -ne 0) { throw 'Offline build failed' }
          & .\experiments\native-bridge\mvp\build\core_tests.exe
          if ($LASTEXITCODE -ne 0) { throw 'Core tests failed' }
          & .\experiments\native-bridge\mvp\build\adapter_tests.exe
          if ($LASTEXITCODE -ne 0) { throw 'Adapter surrogate tests failed' }
          python -B .\experiments\native-bridge\mvp\test_transport.py
          if ($LASTEXITCODE -ne 0) { throw 'Synthetic transport tests failed' }
      - name: Check host syntax and diff
        shell: bash
        run: |
          set -euo pipefail
          python -c "import ast,pathlib; [ast.parse(p.read_text(encoding='utf-8'),feature_version=(3,7)) for p in pathlib.Path('bridge').glob('*.py')]; print('Python 3.7 syntax PASS; not host runtime')"
          git diff --check
      - name: Publish only the tested integration candidate
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- server.mjs tests/native-mcp.test.mjs README.md README.en.md experiments/native-bridge/mvp/README.md experiments/native-bridge/mvp/HANDOFF.md docs/NATIVE_MERGE_SCOPE.md
          git diff --cached --check
          git diff --cached --stat
          git commit -m 'fix(native): require saved crop IDs for reviewed-core integration' -m 'Integrate the reviewed 3c9715c scope only; later SHOW and desktop-trial revisions remain on feature/native-bridge-mvp. No native ABI or runtime changes. Synthetic regression passed; no new real-DM claim.'
          git push origin HEAD:refs/heads/merge/native-core-reviewed-20261023
          echo "TESTED_CANDIDATE=$(git rev-parse HEAD)"
          git status --short
