name: Validate reviewed native core for partial merge
on:
  push:
    branches: [merge/validate-native-core-20261023]
permissions:
  contents: write
jobs:
  validate:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Preserve isolated patch script and check out reviewed baseline
        shell: pwsh
        run: |
          Copy-Item .github/prepare_native_core.py "$env:RUNNER_TEMP/prepare_native_core.py"
          git checkout --detach 3c9715c388e0a109d468de2dbeee2c8b0d8d5d67
          if ($LASTEXITCODE -ne 0) { throw 'baseline checkout failed' }
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Prepare narrow candidate
        run: python "$env:RUNNER_TEMP/prepare_native_core.py"
      - name: Compare installer paths by actual file identity
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('tests/test_native_install.py')
          s = p.read_text(encoding='utf-8')
          old = '        self.assertEqual(record["source_path"], str(self.source))\n        self.assertEqual(record["owned_path"], str(self.target))'
          new = '        self.assertTrue(Path(record["source_path"]).is_absolute())\n        self.assertTrue(Path(record["owned_path"]).is_absolute())\n        self.assertTrue(os.path.samefile(record["source_path"], self.source))\n        self.assertTrue(os.path.samefile(record["owned_path"], self.target))'
          assert s.count(old) == 1
          p.write_text(s.replace(old, new, 1), encoding='utf-8', newline='\n')
          p = Path('docs/NATIVE_MERGE_SCOPE.md')
          with p.open('a', encoding='utf-8', newline='\n') as f:
              f.write('\nThe initial integration regression exposed a test-only Windows short/long\npath comparison mismatch. The corrected test checks absolute paths and real\nfile identity while retaining the checksum, ownership and foreign-file\nprotection assertions. Installer implementation and deletion rules are unchanged.\n')
          PY
      - name: Install isolated test dependencies
        run: python -m pip install -r requirements-dev.txt -r requirements-analysis.txt
      - name: Python synthetic regression
        run: python -B -m unittest discover -s tests -p 'test_*.py' -v
      - name: Node protocol and facade regression
        run: node --test
      - name: Mock MCP chain
        run: node selftest.mjs
        env:
          DM_TEST_PYTHON: python
      - name: Prepare pinned LLVM-MinGW in runner temporary directory
        shell: pwsh
        run: |
          $archive = Join-Path $env:RUNNER_TEMP 'llvm-mingw-20250528-ucrt-x86_64.zip'
          $destination = Join-Path $env:RUNNER_TEMP 'llvm-mingw-isolated'
          curl.exe --fail --location --retry 2 --max-time 180 --output $archive 'https://github.com/mstorsjo/llvm-mingw/releases/download/20250528/llvm-mingw-20250528-ucrt-x86_64.zip'
          if ($LASTEXITCODE -ne 0) { throw 'Official pinned compiler download failed' }
          if ((Get-Item $archive).Length -ne 152403389) { throw 'Compiler archive size differs from pinned release metadata' }
          Get-FileHash -Algorithm SHA256 $archive | Format-List
          New-Item -ItemType Directory -Path $destination | Out-Null
          & 7z.exe x $archive "-o$destination" -y | Select-Object -Last 8
          if ($LASTEXITCODE -ne 0) { throw 'Compiler archive extraction failed' }
          $bin = Join-Path $destination 'llvm-mingw-20250528-ucrt-x86_64\bin'
          $cxx = Join-Path $bin 'clang++.exe'
          if (-not (Test-Path $cxx)) { throw 'Pinned clang++ missing' }
          & $cxx --version
          "NATIVE_VALIDATION_CXX=$cxx" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          $bin | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
      - name: Compile and test synthetic native core
        shell: pwsh
        run: |
          & .\experiments\native-bridge\mvp\build.ps1 -Cxx $env:NATIVE_VALIDATION_CXX -OfflineOnly
          if ($LASTEXITCODE -ne 0) { throw 'Offline build failed' }
          & .\experiments\native-bridge\mvp\build\core_tests.exe
          if ($LASTEXITCODE -ne 0) { throw 'Core tests failed' }
          & .\experiments\native-bridge\mvp\build\adapter_tests.exe
          if ($LASTEXITCODE -ne 0) { throw 'Adapter surrogate tests failed' }
          python -B .\experiments\native-bridge\mvp\test_transport.py
          if ($LASTEXITCODE -ne 0) { throw 'Synthetic transport tests failed' }
      - name: Check host syntax and diff
        shell: bash
        run: |
          set -euo pipefail
          python -c "import ast,pathlib; [ast.parse(p.read_text(encoding='utf-8'),feature_version=(3,7)) for p in pathlib.Path('bridge').glob('*.py')]; print('Python 3.7 syntax PASS; not host runtime')"
          git diff --check
      - name: Publish only the tested integration candidate
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- server.mjs tests/native-mcp.test.mjs tests/test_native_install.py README.md README.en.md experiments/native-bridge/mvp/README.md experiments/native-bridge/mvp/HANDOFF.md docs/NATIVE_MERGE_SCOPE.md
          git diff --cached --check
          git diff --cached --stat
          git commit -m 'fix(native): require saved crop IDs for reviewed-core integration' -m 'Integrate the reviewed 3c9715c scope only; later SHOW and desktop-trial revisions remain on feature/native-bridge-mvp. Normalize test-only installer path identity. No native ABI/runtime or installer implementation changes. Synthetic regression passed; no new real-DM claim.'
          git push origin HEAD:refs/heads/merge/native-core-reviewed-20261023
          echo "TESTED_CANDIDATE=$(git rev-parse HEAD)"
          git status --short
