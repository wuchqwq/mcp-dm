name: Validate native dtype and script-slot onboarding
on:
  push:
    branches:
      - repair/validate-stable-dtype-fixture-20261023
permissions:
  contents: read
jobs:
  synthetic:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Isolated dependencies
        run: python -m pip install -r requirements-dev.txt -r requirements-analysis.txt
      - name: Full Python synthetic and fake-DM tests
        run: python -B -m unittest discover -s tests -p 'test_*.py' -v
      - name: Node protocol tests
        run: node --test
      - name: Mock MCP chain
        run: node selftest.mjs
        env:
          DM_TEST_PYTHON: python
      - name: Python 3.7 bridge syntax (not GMS runtime)
        run: python -c "import ast,pathlib; [ast.parse(p.read_text(encoding='utf-8'),feature_version=(3,7)) for p in pathlib.Path('bridge').glob('*.py')]; print('syntax PASS')"
      - name: Check diff
        shell: bash
        run: git diff --check HEAD^ HEAD
