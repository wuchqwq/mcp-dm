name: Isolated metadata subtree validation
on:
  push:
    branches: [repair/validate-metadata-subtree-20261022]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  synthetic:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements-dev.txt
      - name: Apply revision-guarded metadata repair
        run: python .github/apply_metadata_patch.py
      - name: Python synthetic and fake-DM regression tests
        run: python -B -m unittest discover -s tests -p 'test_*.py' -v
      - name: Node protocol tests
        run: npm test
      - name: Mock MCP chain
        run: npm run test:mock
        env:
          DM_TEST_PYTHON: python
      - name: Publish tested code only to a repair branch
        run: |
          git diff --check
          git read-tree 7f90337d35a0ef56e4d7990b58f53fca65cf3470
          git add -- bridge/dm_bridge.py server.mjs tests/test_metadata_paths.py README.md README.en.md AGENTS.md ROADMAP.md
          tree=$(git write-tree)
          commit=$(printf 'fix: resolve metadata subtrees before bounded traversal\n\nPreserve explicit path status, typed reads and independent lookup limits. Add regression coverage and a focused analysis roadmap. Real DM acceptance remains NOT_TESTED.\n' | git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit-tree "$tree" -p 7f90337d35a0ef56e4d7990b58f53fca65cf3470)
          git diff --stat 7f90337d35a0ef56e4d7990b58f53fca65cf3470 "$commit"
          git push origin "$commit:refs/heads/repair/metadata-subtree-tested-20261022"
          echo "Tested commit: $commit"
