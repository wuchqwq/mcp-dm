name: Isolated native handoff review
on:
  push:
    branches: [maintenance/native-handoff-validation-20261024]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  baseline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: d59c0ce71875db0f0ca3bed1ba34eb6472427c00
      - name: Package exact public source baseline
        run: git archive --format=tar.gz -o baseline-d59c0ce.tar.gz HEAD
      - uses: actions/upload-artifact@v4
        with:
          name: public-source-d59c0ce
          path: baseline-d59c0ce.tar.gz
          retention-days: 3
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements-dev.txt -r requirements-analysis.txt
      - name: Python synthetic regression (no DM)
        run: python -B -m unittest discover -s tests -p 'test_*.py' -q
      - name: Node synthetic regression (Windows-only cases may skip)
        run: node --test
      - name: Default mock
        run: DM_TEST_PYTHON=$(command -v python) node selftest.mjs
