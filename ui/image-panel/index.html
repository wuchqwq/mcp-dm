<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>mcp-dm 图像交互</title><link rel="stylesheet" href="/style.css"></head>
<body><header><strong>mcp-dm · 图像交互</strong><span id="identity"></span><button id="reload">刷新当前对象</button></header>
<main><aside>
<section><h2>观察</h2><label>帧（从 1 开始）<input id="frame" type="number" min="1" value="1"></label><button id="set-frame">选帧</button><label>画布缩放<input id="zoom" type="range" min="0.5" max="4" step="0.1" value="1"></label><p>滚动查看放大图；画布缩放不改变科学坐标。</p></section>
<section><h2>选区与标记</h2><label>鼠标工具<select id="mode"><option value="rectangle">框 ROI</option><option value="point">点选峰／位置</option><option value="line">线段／测量</option><option value="arrow">短箭头</option><option value="edit">拖动已有标注</option></select></label><div class="buttons"><button id="apply-roi">查看选区</button><button id="fft">选区 FFT</button><button id="measure">测量线段／FFT 峰</button><button id="share">把选择交给 Agent</button><button id="full">完整频谱</button></div><pre id="selection">在图中点击或拖拽，选择将使用原图／原 FFT 坐标。</pre><p>单个 FFT 峰相对数学 DC 测量几何周期，不等于确认物相。</p></section>
<section><h2>标注修订</h2><label>已有标记<select id="existing"><option value="">新增标记</option></select></label><label>标记 ID<input id="mark-id" placeholder="例如 peak-a"></label><label>文字<input id="mark-text" maxlength="256"></label><div class="row"><label>颜色<select id="color"><option value="cyan">青色</option><option value="orange">橙色（第二相候选）</option><option value="white">白色</option><option value="amber">琥珀</option><option value="green">绿色</option></select></label><label>状态<select id="status"><option value="hypothesized">候选</option><option value="user_confirmed">用户确认</option><option value="retracted">撤回</option></select></label></div><button id="save-mark">保存这条标记</button><p>颜色不确认物相。拖动后点保存；其余标记保留。</p></section>
<section><h2>显示草稿</h2><label>Gamma <output id="gamma-label">1</output><input id="gamma" type="range" min="0.1" max="3" step="0.05" value="1"></label><div class="row"><label>下限<input id="low" type="number" step="any"></label><label>上限<input id="high" type="number" step="any"></label></div><label><input id="axes" type="checkbox"> FFT 频率刻度</label><label><input id="scale" type="checkbox"> 空间比例尺</label><button id="apply-display">提交显示调整</button><p>滑动即时反馈仅为 PNG 近似草稿；提交后从科学数组重绘，不重算 FFT。</p></section>
<section id="calibration"><h2>口述 XY 标定</h2><div class="row"><label>X 单位/px<input id="scale-x" type="number" step="any"></label><label>Y 单位/px<input id="scale-y" type="number" step="any"></label></div><label>单位<select id="unit"><option value="nm">nm</option><option value="Å">Å</option><option value="um">µm</option></select></label><label>范围<select id="scope"><option value="sequence">整个序列</option><option value="image">这张图</option></select></label><label>用户陈述 / 来源<textarea id="source" maxlength="2000" placeholder="填入用户的实际说明；不使用示例数值冒充实验标定"></textarea></label><button id="calibrate">保存新标定版本</button><button id="withdraw">撤回标定</button><p>只改变版本化记录与派生显示，不写入原图；帧间距、相位单位另行记录。</p></section>
<section><button id="export">导出当前 PNG / 科学 NPY / 参数</button><button id="recover">查询上次原请求</button><p id="operation"></p></section>
</aside><article><div id="message" role="status">正在连接本地 MCP…</div><div id="viewport"><canvas id="canvas" aria-label="显微图像交互画布"></canvas></div><pre id="metadata"></pre></article></main><script type="module" src="/app.mjs"></script></body></html>
