<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>mcp-dm 图像交互</title><link rel="stylesheet" href="/style.css"></head>
<body><header><strong>mcp-dm · 共同视野</strong><span id="identity"></span><button id="reload">检查 Agent 结果</button></header>
<main><aside>
<section><h2>当前图像</h2><div class="frame-row"><button id="previous-frame" aria-label="上一帧">‹</button><label>帧<input id="frame" type="number" min="1" value="1"></label><button id="set-frame">查看</button><button id="next-frame" aria-label="下一帧">›</button></div><p id="calibration-summary"></p><label>画布缩放 <output id="zoom-label">100%</output><input id="zoom" type="range" min="0.1" max="16" step="0.05" value="1"></label><button id="fit">适应视野</button><p>滚轮以鼠标为中心缩放；空格＋拖动、中键或平移工具移动视野。科学坐标保持不变。</p></section>
<section><h2>观察与选择</h2><label>鼠标工具<select id="mode"><option value="select">选择／直接拖动标注</option><option value="rectangle">框 ROI</option><option value="point">点选峰／位置</option><option value="line">线段／测量</option><option value="arrow">短箭头</option><option value="edit">拖动已有标注</option><option value="pan">平移视野</option></select></label><div class="buttons"><button id="apply-roi">查看选区</button><button id="fft">选区 FFT</button><button id="measure">测量</button><button id="share">交给 Agent</button><button id="full">完整频谱</button></div><p id="selection">在图中圈区域或点选位置。</p><div class="fft-settings"><label>FFT 窗函数<select id="fft-window"><option value="hann">Hann</option><option value="none">无窗</option></select></label><label><input id="fft-mean" type="checkbox" checked> FFT 前去均值</label></div><p id="measurement-summary"></p><p>峰位或候选标记不等于物相确认。选择完成后对 Agent 说“看这里”；不会自动唤醒模型。</p></section>
<section><h2>标注与纠正</h2><label>当前标注<select id="existing"><option value="">新增标记</option></select></label><label>文字<input id="mark-text" maxlength="256" placeholder="可留空；内部 ID 自动生成"></label><div class="row"><label>颜色<select id="color"><option value="cyan">青色</option><option value="orange">橙色（第二相候选）</option><option value="white">白色</option><option value="amber">琥珀</option><option value="green">绿色</option></select></label><label>状态<select id="status"><option value="hypothesized">候选</option><option value="user_confirmed">用户确认</option><option value="retracted">撤回</option></select></label></div><button id="save-mark">保存这条标记</button><button id="undo">撤销草稿</button><button id="redo">恢复草稿</button><button id="discard-local">撤回全部草稿</button><p>直接点选／拖动标注，小方块调整端点。撤销只改本地草稿；保存的旧科学版本仍保留。</p></section>
<section><h2>显示</h2><label>Gamma <output id="gamma-label">1</output><input id="gamma" type="range" min="0.1" max="3" step="0.05" value="1"></label><div class="row"><label>下限<input id="low" type="number" step="any"></label><label>上限<input id="high" type="number" step="any"></label></div><label><input id="axes" type="checkbox"> FFT 频率刻度</label><label><input id="scale" type="checkbox"> 空间比例尺</label><button id="apply-display">保存显示</button><p>即时显示只近似映射干净 PNG；保存后从科学数组重绘。标注颜色独立，不重算 FFT。</p></section>
<details id="calibration"><summary>补充／修订口述 XY 标定</summary><div class="row"><label>X 单位/px<input id="scale-x" type="number" step="any"></label><label>Y 单位/px<input id="scale-y" type="number" step="any"></label></div><label>单位<select id="unit"><option value="nm">nm</option><option value="Å">Å</option><option value="um">µm</option></select></label><label>范围<select id="scope"><option value="sequence">整个序列</option><option value="image">这张图</option></select></label><label>用户说明／来源<textarea id="source" maxlength="2000" placeholder="只填写用户实际提供的标定"></textarea></label><button id="calibrate">保存新标定版本</button><button id="withdraw">撤回标定</button><p>不修改文件或原像素；帧间距、相位单位分别管理。</p></details>
<section><button id="export">导出 PNG / 科学 NPY / 参数</button><p id="draft-status"></p></section>
<details><summary>高级信息与恢复</summary><label>内部标记 ID（自动生成）<input id="mark-id" readonly></label><button id="recover">查询上次原请求</button><pre id="metadata"></pre><pre id="operation"></pre><details><summary>前端性能（只读）</summary><pre id="performance-data"></pre></details></details>
</aside><article><div id="message" role="status">正在连接本地 MCP…</div><div id="pending-result" hidden><span id="pending-message"></span><button id="discard-draft">放弃草稿，查看保存结果</button><button id="accept-agent-result">查看 Agent 结果</button></div><div id="viewport"><div id="image-stage"><canvas id="base-canvas" aria-label="干净图像底图"></canvas><canvas id="marks-canvas" aria-label="已保存标注"></canvas><canvas id="canvas" aria-label="显微图像交互画布"></canvas></div></div></article></main><script type="module" src="/app.mjs"></script></body></html>
