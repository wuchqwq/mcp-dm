name: Standalone provider smoke
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  node-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check server.mjs
      - run: npm test
